spring.datasource.url =jdbc:mysql://localhost:3306/sms?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

#Hibernate Dialect
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

#Hibernate auto ddl. Used to generate database tables with update value in case of non existent or update it in case of already existing.
spring.jpa.hibernate.ddl-auto=update 

#loggingf for hibernate
logging.level.org.hibernate.SQL=DEBUG
